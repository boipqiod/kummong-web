<svg width="200px" height="200px" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="Kummong Logo">
  <defs>
    <filter id="ink-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" />
    </filter>
  </defs>

  <circle cx="100" cy="100" r="98" fill="#f7f5ef" />

  <path
    d="M100,20 C150,20 180,60 180,100 C180,150 140,180 100,180 C60,180 20,140 20,100 C20,50 60,20 100,20"
    fill="none"
    stroke="#2b2b2b"
    stroke-width="8"
    stroke-linecap="round"
    filter="url(#ink-texture)"
    opacity="0.9"
    stroke-dasharray="400 100"
  />

  <path
    d="M40 110 Q 100 80 160 110"
    fill="none"
    stroke="#2b2b2b"
    stroke-width="6"
    stroke-linecap="round"
    filter="url(#ink-texture)"
  />

  <circle cx="100" cy="70" r="12" fill="#8b5a2b" opacity="0.8" />

  <path
    d="M50 130 Q 70 115 90 130 T 130 130 T 160 130"
    fill="none"
    stroke="#8b5a2b"
    stroke-width="2"
    opacity="0.6"
    stroke-dasharray="4 4"
  />

  <g transform="rotate(-10 147 147)" opacity="0.9">
    <rect x="135" y="135" width="24" height="24" rx="2" fill="#c0392b" />
    <text
      x="147"
      y="152"
      font-family="serif"
      font-size="14"
      fill="#f7f5ef"
      text-anchor="middle"
      font-weight="bold"
      dominant-baseline="central"
    >
      夢
    </text>
  </g>
</svg>